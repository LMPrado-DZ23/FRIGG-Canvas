name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Typecheck · Test · Build · E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Secret scan
        shell: bash
        run: |
          ! git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}' -- ':!package-lock.json' ':!.env.example'
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Electron smoke (Linux)
        shell: bash
        run: |
          set +e
          ELECTRON_DISABLE_SANDBOX=1 timeout 20s xvfb-run -a npm start > /tmp/frigg-electron-smoke.log 2>&1
          code=$?
          cat /tmp/frigg-electron-smoke.log
          if [ "$code" -ne 124 ]; then exit "$code"; fi
      - name: E2E (Playwright + Electron)
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-linux
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  windows:
    name: Test · E2E · Portable smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Resolução de CLIs (.cmd/PATHEXT) e kill de árvore são específicos do Windows.
      - name: Test
        run: npm test
      - name: Package portable
        run: npm run package:portable
      # Roda a suíte contra o FRIGG.exe portátil (pega bugs de empacotamento, ex.: preload quebrado).
      - name: E2E against portable FRIGG.exe
        shell: pwsh
        run: |
          $env:FRIGG_E2E_EXECUTABLE = (Resolve-Path "release/FRIGG-win/FRIGG.exe").Path
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-windows
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Smoke test FRIGG.exe
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "release/FRIGG-win/FRIGG.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "FRIGG.exe encerrou durante o smoke test (code=$($process.ExitCode))" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: FRIGG-windows-portable
          path: release/FRIGG-win
          if-no-files-found: error
