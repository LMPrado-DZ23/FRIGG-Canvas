name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Secret scan
        shell: bash
        run: |
          ! git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}' -- ':!package-lock.json' ':!.env.example'
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Electron smoke (Linux)
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a npm start > /tmp/frigg-electron-smoke.log 2>&1
          code=$?
          cat /tmp/frigg-electron-smoke.log
          if [ "$code" -ne 124 ]; then exit "$code"; fi

  windows-portable-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:portable
      - name: Smoke test FRIGG.exe
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "release/FRIGG-win/FRIGG.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "FRIGG.exe encerrou durante o smoke test (code=$($process.ExitCode))" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FRIGG-windows-portable
          path: release/FRIGG-win
          if-no-files-found: error
