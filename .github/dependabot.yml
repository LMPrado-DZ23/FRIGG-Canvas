version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x suporta TypeScript < 6.1; o TS 7 deixaria o lint sem cobertura.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Patches e minors juntos num PR só; majors ficam separados para revisão.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
